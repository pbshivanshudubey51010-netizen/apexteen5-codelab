<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApexTeen5 ULTIMATE Engine</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
*{margin:0;box-sizing:border-box}body{height:100vh;display:flex;background:#0a0a0a;color:#fff;font-family:Consolas;overflow:hidden}
.side{width:180px;background:#000;border-right:1px solid #222;display:flex;flex-direction:column;padding:8px}
.side b{color:gold;letter-spacing:1px;margin:5px 0 10px 0;font-size:13px}
.side button{width:100%;text-align:left;padding:8px 8px;margin:3px 0;background:#111;color:#bbb;border:1px solid #222;border-radius:8px;font-size:13px}
.side button.on{background:gold;color:#000;font-weight:900;border-color:gold}
.side .small{font-size:11px;color:#666;margin-top:12px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:44px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 10px;gap:8px}
.top-left{display:flex;align-items:center;gap:8px}
.top-left span{background:#1c1c1c;border:1px solid #333;padding:4px 10px;border-radius:20px;font-size:12px;color:gold}
.top-right{display:flex;gap:6px}
.btn{border:0;border-radius:20px;padding:7px 14px;font-weight:800;cursor:pointer}
.btn-gold{background:gold;color:#000} .btn-dark{background:#222;color:#fff;border:1px solid #333}
.CodeMirror{flex:1;height:100% !important;font-size:14px;line-height:1.5}
.out{height:42%;background:#000;border-top:2px solid gold;display:flex;flex-direction:column;min-height:140px}
.out-head{height:32px;background:#111;border-bottom:1px solid #222;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.out-head div button{background:transparent;border:0;color:#888;padding:5px 10px;cursor:pointer}
.out-head div button.on{color:gold;border-bottom:2px solid gold}
#term{flex:1;overflow:auto;padding:8px 10px;color:#0f0;font-size:13px;white-space:pre-wrap}
#prev{flex:1;width:100%;height:100%;border:0;background:#fff;display:none}
#ai-box{position:absolute;bottom:48%;left:190px;right:10px;background:#111;border:1px solid gold;border-radius:8px;padding:6px;display:none;z-index:10;color:#aaa;font-size:12px}
</style>
</head>
<body>
<div class="side">
<b>⚡ APEX ULTIMATE</b>
<button class="on" id="f-main.py" onclick="openF('main.py')">🐍 main.py</button>
<button id="f-index.html" onclick="openF('index.html')">🌐 index.html</button>
<button id="f-game.js" onclick="openF('game.js')">🎮 game.js</button>
<button id="f-style.css" onclick="openF('style.css')">🎨 style.css</button>
<button onclick="newF()">+ New File</button>
<button onclick="exportAll()" style="margin-top:10px;background:#0a2a0a;border-color:#0f0;color:#0f0">⬇ Export ZIP</button>
<div class="small">Auto-Save: ON<br>Python: Pyodide<br>AI Hint: Ctrl+Space</div>
</div>

<div class="main">
<div class="top">
<div class="top-left"><span id="fname">main.py</span><span id="status">Loading Python...</span></div>
<div class="top-right">
<button class="btn btn-dark" onclick="formatCode()">✨ Format</button>
<button class="btn btn-dark" onclick="showOut('prev')">Preview</button>
<button class="btn btn-gold" onclick="run()">▶ RUN (Ctrl+Enter)</button>
</div>
</div>

<textarea id="ed"></textarea>

<div id="ai-box">💡 AI Hint: <span id="ai-text"></span> <b style="float:right;color:gold;cursor:pointer" onclick="this.parentElement.style.display='none'">X</b></div>

<div class="out">
<div class="out-head">
<div><button class="on" id="bt-term" onclick="showOut('term')">Console</button><button id="bt-prev" onclick="showOut('prev')">Preview / Game</button></div>
<div style="font-size:11px;color:#555">ApexTeen5 Engine v5.0</div>
</div>
<pre id="term">Ultimate Engine Starting...
- Monaco-like Editor: OK
- Python + Numpy: Loading
- Game Engine: Ready
- AI Autocomplete: Ctrl+Space dabao
</pre>
<iframe id="prev"></iframe>
</div>
</div>

<script>
let FILES=JSON.parse(localStorage.getItem('apex_ultimate')||JSON.stringify({
"main.py":"# JAI MAA SARASWATI\n# Ultimate Engine Test\nimport sys, math\nprint('🚀 Ultimate Engine Chal Raha Hai')\nprint('Python:', sys.version.split()[0])\n\n# Game Logic bhi Python se\nfor i in range(1,6):\n    print(f'Level {i} Ready: {i*20} points')\n\n# AI Sample\ndef ai_hello(name):\n    return f'Hello {name}, Welcome to ApexTeen5'\n\nprint(ai_hello('Shivanshu'))",
"index.html":"<div style=\"text-align:center;background:#000;color:#fff;padding:15px;font-family:Arial\">\n<h1 style=\"color:gold\">⚡ APEX ULTIMATE GAME</h1>\n<canvas id=\"c\" width=\"340\" height=\"400\" style=\"background:#111;border:2px solid gold;border-radius:12px\"></canvas>\n<p>Score: <b id=\"score\" style=\"color:gold\">0</b></p>\n<div><button ontouchstart=\"L=1\" ontouchend=\"L=0\" onmousedown=\"L=1\" onmouseup=\"L=0\" style=\"padding:12px 18px;margin:4px;background:#222;color:#fff;border:1px solid gold;border-radius:8px\">◀</button><button onclick=\"location.reload()\" style=\"padding:12px 18px;margin:4px;background:gold;border:0;border-radius:8px;font-weight:700\">RESTART</button><button ontouchstart=\"R=1\" ontouchend=\"R=0\" onmousedown=\"R=1\" onmouseup=\"R=0\" style=\"padding:12px 18px;margin:4px;background:#222;color:#fff;border:1px solid gold;border-radius:8px\">▶</button></div>\n</div>",
"game.js":"let cv=document.getElementById('c'),ctx=cv.getContext('2d'),x=150,s=0,rocks=[],L=0,R=0;\nfunction loop(){\n ctx.clearRect(0,0,340,400);\n if(L)x-=5;if(R)x+=5; if(x<0)x=0;if(x>310)x=310;\n ctx.fillStyle='gold';ctx.fillRect(x,350,30,20);\n if(Math.random()<0.04) rocks.push({x:Math.random()*320,y:-10});\n for(let i=rocks.length-1;i>=0;i--){\n  let r=rocks[i]; r.y+=3; ctx.fillStyle='red';ctx.fillRect(r.x,r.y,18,18);\n  if(r.y>400)rocks.splice(i,1);\n  if(r.x>x&&r.x<x+30&&r.y>340&&r.y<370){ alert('Game Over Score:'+s); s=0; rocks=[]; document.getElementById('score').innerText=0; }\n }\n s++; if(s%10==0) document.getElementById('score').innerText=s;\n requestAnimationFrame(loop);\n}\nloop();\n document.addEventListener('keydown',e=>{if(e.key=='ArrowLeft')L=1;if(e.key=='ArrowRight')R=1});\n document.addEventListener('keyup',e=>{if(e.key=='ArrowLeft')L=0;if(e.key=='ArrowRight')R=0});",
"style.css":"body{margin:0;background:#000;color:#fff;font-family:Arial} h1{color:gold}"
}));

let cur='main.py', py=null, editor=CodeMirror.fromTextArea(document.getElementById('ed'),{lineNumbers:true,theme:'dracula',mode:'python',indentUnit:4,extraKeys:{"Ctrl-Space":"autocomplete","Ctrl-Enter":run}});

(async()=>{
 try{
  py=await loadPyodide();
  await py.loadPackage(['numpy']);
  document.getElementById('status').textContent='Python Ready ✅';
  document.getElementById('term').textContent='✅ Ultimate Ready - Run dabao\\nCtrl+Space = AI Hint';
 }catch(e){ document.getElementById('status').textContent='Web Only'; }
})();

function openF(n){
 cur=n; document.getElementById('fname').textContent=n;
 editor.setOption('mode', n.endsWith('.py')?'python': n.endsWith('.js')?'javascript':'xml');
 editor.setValue(FILES[n]||'');
 document.querySelectorAll('.side button').forEach(b=>b.classList.remove('on'));
 let b=document.getElementById('f-'+n); if(b) b.classList.add('on');
 showOut(n.endsWith('.py')?'term':'prev');
}
editor.on('change',()=>{ FILES[cur]=editor.getValue(); localStorage.setItem('apex_ultimate',JSON.stringify(FILES)); aiHint(); });

let hintTimer=null;
function aiHint(){
 let box=document.getElementById('ai-box'), txt=document.getElementById('ai-text');
 let v=editor.getValue(); let last=v.slice(-40);
 if(last.includes('print')){ txt.textContent='print("Hello") use karo'; box.style.display='block'; }
 else if(last.includes('for')){ txt.textContent='for i in range(10): ...'; box.style.display='block'; }
 else if(last.includes('def')){ txt.textContent='def myFunc(): return ...'; box.style.display='block'; }
 clearTimeout(hintTimer); hintTimer=setTimeout(()=>box.style.display='none',3000);
}

async function run(){
 FILES[cur]=editor.getValue(); localStorage.setItem('apex_ultimate',JSON.stringify(FILES));
 let term=document.getElementById('term'), prev=document.getElementById('prev');
 if(cur.endsWith('.py')){
  showOut('term'); term.textContent='⏳ Running Python...';
  try{ let out=''; py.setStdout({batched:(t)=>out+=t}); py.setStderr({batched:(t)=>out+=t}); let r=await py.runPythonAsync(FILES[cur]); term.textContent=out+(r!==undefined?'\\n=> '+r:'\\n✅ Done'); }
  catch(e){ term.textContent='❌ Error:\\n'+e; }
 } else {
  showOut('prev'); let html=FILES['index.html']||''; let css=FILES['style.css']||''; let js=FILES['game.js']||'';
  prev.srcdoc=`<style>${css}</style>${html}<script>${js}<\/script>`;
 }
}
function showOut(id){
 document.getElementById('term').style.display=id=='term'?'block':'none';
 document.getElementById('prev').style.display=id=='prev'?'block':'none';
 document.getElementById('bt-term').classList.toggle('on',id=='term');
 document.getElementById('bt-prev').classList.toggle('on',id=='prev');
}
function newF(){ let n=prompt('File naam: demo.py / page.html / app.js'); if(n){ FILES[n]=''; localStorage.setItem('apex_ultimate',JSON.stringify(FILES)); let btn=document.createElement('button'); btn.id='f-'+n; btn.textContent=n; btn.onclick=()=>openF(n); document.querySelector('.side').insertBefore(btn,document.querySelector('.side').children[5]); openF(n); } }
function formatCode(){ editor.execCommand('selectAll'); let v=editor.getValue(); editor.setValue(v.trim()+'\\n'); }
function exportAll(){ let blob=new Blob([JSON.stringify(FILES,null,2)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='apex-project.json'; a.click(); }

openF('main.py');
</script>
</body>
</html>
