
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeLab Mobile</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131c;color:#f5f7ff;font-family:Arial,sans-serif}
header{padding:16px;background:#1c2230}
h2{margin:0 0 5px}
p{margin:0;color:#b9c2d5;font-size:14px}
main{padding:12px;max-width:900px;margin:auto}
label{display:block;margin:14px 0 7px;font-weight:bold}
textarea{width:100%;height:145px;resize:vertical;background:#090c13;color:#b9e5ff;border:1px solid #3b455b;border-radius:9px;padding:12px;font:14px monospace}
button{padding:12px 16px;border:0;border-radius:8px;font-weight:bold;font-size:15px;cursor:pointer}
#run{background:#22c55e;color:#07120a;margin:14px 0}
#clear{background:#30394c;color:white}
iframe{width:100%;height:350px;background:white;border:1px solid #59647a;border-radius:9px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
<h2>⚡ CodeLab Mobile</h2>
<p>Write HTML, CSS & JavaScript — Preview your design</p>
</header>
<main>
<label for="html">HTML</label>
<textarea id="html" spellcheck="false"><h1>Hello World!</h1>
<p>My first frontend design</p>
<button onclick="document.querySelector('p').textContent='It works!'">Click Me</button></textarea>

<label for="css">CSS</label>
<textarea id="css" spellcheck="false">body {
  font-family: Arial;
  text-align: center;
  padding: 30px;
  background: #f0f7ff;
}
h1 { color: #2563eb; }
button {
  padding: 12px 20px;
  background: #2563eb;
  color: white;
  border: 0;
  border-radius: 8px;
}</textarea>

<label for="js">JavaScript</label>
<textarea id="js" spellcheck="false">console.log("Hello from JavaScript!");</textarea>

<div class="actions">
<button id="run">▶ Run Preview</button>
<button id="clear">Reset</button>
</div>

<label>Live Preview</label>
<iframe id="preview" title="Code output" sandbox="allow-scripts"></iframe>
</main>

<script>
const html=document.getElementById('html');
const css=document.getElementById('css');
const js=document.getElementById('js');
const preview=document.getElementById('preview');

function runCode(){
 const source=html.value;
 const style=css.value.replace(/<\/style/gi,'<\\/style');
 const script=js.value.replace(/<\/script/gi,'<\\/script');
 preview.srcdoc='<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>'+style+'</style></head><body>'+source+'<script>'+script+'<\/script></body></html>';
}
document.getElementById('run').addEventListener('click',runCode);
document.getElementById('clear').addEventListener('click',()=>{
 html.value='';css.value='';js.value='';preview.srcdoc='';
});
runCode();
</script>
</body>
</html>
