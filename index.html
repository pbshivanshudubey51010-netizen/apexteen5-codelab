
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApexTeen5 CodeLab</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #151925;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #69e6a6;
    }

    textarea {
      width: 100%;
      height: 180px;
      box-sizing: border-box;
      padding: 12px;
      background: #252b3b;
      color: #a8f0c6;
      font-size: 16px;
      border-radius: 8px;
    }

    button {
      margin: 12px 0;
      padding: 12px 20px;
      background: #32c875;
      border: 0;
      border-radius: 6px;
      font-size: 16px;
    }

    iframe {
      width: 100%;
      height: 180px;
      background: white;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>ApexTeen5 CodeLab 🚀</h1>
  <p>अपना HTML कोड लिखो और Run दबाओ।</p>

  <textarea id="code"><h2>नमस्ते दुनिया!</h2>
<p>मैं अपनी कोडिंग वेबसाइट बना रहा हूँ।</p></textarea>

  <br>
  <button onclick="runCode()">Run ▶</button>

  <h3>Output</h3>
  <iframe id="output" sandbox=""></iframe>

  <script>
    function runCode() {
      const code = document.getElementById("code").value;
      document.getElementById("output").srcdoc = code;
    }
    runCode();
  </script>
</body>
</html>
