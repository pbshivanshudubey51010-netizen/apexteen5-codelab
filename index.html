<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApexTeen5 - GitHub Colab</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
*{box-sizing:border-box;margin:0}body{font-family:Consolas,monospace;background:#0e0e0e;color:#fff;display:flex;height:100vh}
.side{width:200px;background:#000;border-right:1px solid #222;padding:10px;display:flex;flex-direction:column}
.side b{color:#ffcc00;margin-bottom:10px}.side button{padding:8px;background:#111;color:#fff;border:1px solid #333;border-radius:6px;margin-bottom:6px;text-align:left;cursor:pointer}
.side button.active{background:#ffcc00;color:#000;font-weight:800}
.main{flex:1;display:flex;flex-direction:column}
.top{padding:10px;background:#111;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.top button{padding:7px 12px;border-radius:20px;border:none;font-weight:700;cursor:pointer}
.editor{flex:1;display:flex;flex-direction:column}
.editor textarea{flex:1;background:#1e1e1e;color:#fff;border:none;padding:12px;font-size:14px;outline:none}
.output{height:35%;background:#000;border-top:2px solid #ffcc00;padding:10px;overflow:auto}
.output iframe{width:100%;height:100%;border:none;background:#fff}
.output pre{color:#0f0;white-space:pre-wrap}
.hint{padding:6px;background:#1a1a1a;color:#888;font-size:11px}
</style>
</head>
<body>
<div class="side">
<b>APEXTEEN5 - GitHub Only</b>
<button class="active" onclick="openFile('main.py')" id="f-main.py">📄 main.py (Python)</button>
<button onclick="openFile('index.html')" id="f-index.html">📄 index.html (HTML)</button>
<button onclick="openFile('style.css')" id="f-style.css">🎨 style.css (CSS)</button>
<button onclick="openFile('game.js')" id="f-game.js">🎮 game.js (JS Game/Photo)</button>
<hr style="margin:10px 0;border-color:#222">
<button onclick="newCell()">+ Add Colab Cell</button>
<button onclick="clearSave()" style="color:#ff5555">🗑️ Clear All</button>
<p style="font-size:10px;color:#555;margin-top:20px">Sab GitHub + Browser me save hai. Koi server nahi. Jai Maa Saraswati</p>
</div>
<div class="main">
<div class="top">
<span id="fname">main.py</span>
<div><button onclick="run()" style="background:#ffcc00;color:#000">▶ Run</button></div>
</div>
<div class="hint">💡 GitHub Pages pe hi Colab jaisa: Python cell add karo, HTML se website banao, JS se Game/Photo banao. Code auto-save hai.</div>
<div class="editor"><textarea id="code"></textarea></div>
<div class="output"><pre id="pyout" style="display:none"></pre><iframe id="webout"></iframe></div>
</div>

<script>
let files = JSON.parse(localStorage.getItem('apex_files') || '{"main.py":"print(\'Jai Maa Saraswati - GitHub Colab\')\\n# Python + Colab Cell\\nfor i in range(3):\\n  print(\'Cell\', i)","index.html":"<h1>Meri Website</h1>\\n<button onclick=\\"play()\\">Play Game</button>\\n<canvas id=\\"c\\" width=\\"300\\" height=\\"120\\" style=\\"border:2px solid gold\\"></canvas>","style.css":"body{text-align:center;background:#000;color:#fff}\\nh1{color:gold}","game.js":"// Game + Photo Logic\\nlet c=document.getElementById(\\"c\\");\\nif(c){let x=c.getContext(\\"2d\\");x.fillStyle=\\"gold\\";x.fillRect(20,20,60,30);x.fillStyle=\\"white\\";x.fillText(\\"Apex Photo\\",22,40)}\\nfunction play(){alert(\\"Game Running - GitHub Only!\\")}"}');
let current = 'main.py';
let pyodide = null;
async function loadPy(){pyodide = await loadPyodide(); document.getElementById('pyout').textContent='Pyodide Ready - Asli Python Loaded (Numpy bhi chalega)';}
loadPy();

function openFile(name){
 current=name; document.getElementById('fname').innerText=name;
 document.getElementById('code').value=files[name]||'';
 document.querySelectorAll('.side button').forEach(b=>b.classList.remove('active'));
 let btn=document.getElementById('f-'+name); if(btn) btn.classList.add('active');
 run();
}
document.getElementById('code').addEventListener('input', e=>{
 files[current]=e.target.value;
 localStorage.setItem('apex_files', JSON.stringify(files));
});

async function run(){
 let code = document.getElementById('code').value;
 files[current]=code; localStorage.setItem('apex_files', JSON.stringify(files));
 if(current.endsWith('.py')){
   document.getElementById('pyout').style.display='block'; document.getElementById('webout').style.display='none';
   let out=document.getElementById('pyout'); out.textContent='Running...';
   try{ let res = await pyodide.runPythonAsync(code); out.textContent = res ? res.toString() : '✓ Done - GitHub pe Python chal gaya'; }catch(err){ out.textContent='Error: '+err; }
 }else{
   document.getElementById('pyout').style.display='none'; document.getElementById('webout').style.display='block';
   let html = files['index.html']||''; let css = files['style.css']||''; let js = files['game.js']||'';
   if(current=='index.html') html=code; if(current=='style.css') css=code; if(current=='game.js') js=code;
   document.getElementById('webout').srcdoc=`<style>${css}</style>${html}<script>${js}<\/script>`;
 }
}
function newCell(){
 let n = prompt('Cell ka naam likho jaise cell2.py');
 if(n){ files[n]='print("New Colab Cell - '+n+'")'; localStorage.setItem('apex_files', JSON.stringify(files)); location.reload(); }
}
function clearSave(){ if(confirm('GitHub ka sab data delete?')){ localStorage.removeItem('apex_files'); location.reload(); } }

openFile('main.py');
</script>
</body>
</html>
