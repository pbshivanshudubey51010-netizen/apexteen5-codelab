<script>
let py=null;
async function init(){
 py=await loadPyodide();
 document.getElementById('pyout').textContent='Real Python Ready - Pyodide (Colab jaisa)';
 runAll();
}
init();
async function runAll(){
 // 1. REAL PYTHON ENGINE
 let pcode=document.getElementById('py').value;
 let pout=document.getElementById('pyout');
 pout.textContent='Running Real Python...';
 try{ 
  await py.loadPackage('numpy'); // Real engine load
  let r=await py.runPythonAsync(pcode);
  pout.textContent=r?r.toString():'✓ Real Python Done';
 }catch(e){ pout.textContent='Error: '+e; }

 // 2. REAL HTML/CSS/JS ENGINE
 let wcode=document.getElementById('web').value;
 document.getElementById('webout').srcdoc=wcode;
}
function focusTab(t){ runAll(); }
</script>
