<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Racing Game</title>
<style>
body{margin:0;background:#171717;color:white;text-align:center;font-family:Arial}
h2{margin:12px}
#track{width:240px;height:400px;max-width:90vw;background:#444;margin:10px auto;position:relative;overflow:hidden;border-left:5px solid white;border-right:5px solid white}
.car{width:40px;height:60px;position:absolute;border-radius:8px;box-sizing:border-box;border:2px solid white}
#player{background:lime;bottom:10px;left:100px}
.enemy{background:red;top:-70px}
button{font-size:18px;padding:12px 18px;margin:5px;border:0;border-radius:8px}
#status{min-height:24px;color:yellow}
</style>
</head>
<body>
<h2>🏎️ Racing Game</h2>
<h3>Score: <span id="score">0</span></h3>
<div id="track">
<div id="car1" class="car enemy" style="left:20px"></div>
<div id="car2" class="car enemy" style="left:180px;top:-220px;background:orange"></div>
<div id="player" class="car"></div>
</div>
<div>
<button id="left">◀ Left</button>
<button id="right">Right ▶</button>
</div>
<div id="status">Press Start to play!</div>
<button id="start">▶ Start / Restart</button>
<script>
const player=document.getElementById("player");
const enemies=[document.getElementById("car1"),document.getElementById("car2")];
const scoreEl=document.getElementById("score");
const statusEl=document.getElementById("status");
const track=document.getElementById("track");
let x=100,score=0,speed=3,running=false,raf=0,last=0;
function move(d){
 if(!running)return;
 x=Math.max(0,Math.min(track.clientWidth-40,x+d));
 player.style.left=x+"px";
}
document.getElementById("left").addEventListener("click",()=>move(-40));
document.getElementById("right").addEventListener("click",()=>move(40));
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")move(-40);
 if(e.key==="ArrowRight")move(40);
});
function reset(){
 cancelAnimationFrame(raf);
 x=(track.clientWidth-40)/2;score=0;speed=3;running=true;last=0;
 player.style.left=x+"px";
 enemies[0].style.top="-70px";enemies[0].style.left="20px";
 enemies[1].style.top="-220px";enemies[1].style.left="180px";
 scoreEl.textContent="0";statusEl.textContent="Use Left / Right to avoid cars!";
 raf=requestAnimationFrame(loop);
}
function loop(t){
 if(!running)return;
 const dt=last?Math.min((t-last)/16.67,2):1;last=t;
 for(const car of enemies){
  let top=car.offsetTop+speed*dt;
  if(top>track.clientHeight){
   top=-80;score+=10;
   const lanes=[0,80,160,200].filter(v=>v<=track.clientWidth-40);
   car.style.left=lanes[Math.floor(Math.random()*lanes.length)]+"px";
  }
  car.style.top=top+"px";
  const a=player.getBoundingClientRect(),b=car.getBoundingClientRect();
  if(a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top){
   running=false;statusEl.textContent="Game Over! Tap Restart to play again.";
  }
 }
 scoreEl.textContent=score;
 speed=3+Math.min(score/100,4);
 if(running)raf=requestAnimationFrame(loop);
}
document.getElementById("start").addEventListener("click",reset);
</script>
</body>
</html>
