<div id="aiBot" style="position:fixed;bottom:20px;right:20px;z-index:999">
  <div id="botBox" style="display:none;width:320px;height:400px;background:#111;border:2px solid #ffcc00;border-radius:15px;flex-direction:column;overflow:hidden">
    <div style="background:#ffcc00;color:#000;padding:10px;font-weight:bold">ApexTeen AI ✨</div>
    <div id="botChat" style="flex:1;padding:10px;overflow:auto;font-size:14px">Hi! Python ya Game ka code pucho...</div>
    <div style="display:flex;padding:5px"><input id="botInput" placeholder="Code likho..." style="flex:1;padding:8px;border-radius:20px;border:none"><button onclick="askBot()" style="margin-left:5px;background:#ffcc00;border:none;border-radius:50%;width:35px;height:35px">➤</button></div>
  </div>
  <button onclick="document.getElementById('botBox').style.display=document.getElementById('botBox').style.display==='flex'?'none':'flex'" style="width:60px;height:60px;border-radius:50%;background:#ffcc00;border:none;font-size:25px;box-shadow:0 0 20px #ffcc00">🤖</button>
</div>
<script>
function askBot(){
 let q=document.getElementById('botInput').value;
 let chat=document.getElementById('botChat');
 chat.innerHTML+=`<div style="text-align:right;margin:5px;color:#ffcc00">You: ${q}</div>`;
 let ans="Iska code Python Lab me daal kar run karo:<br><code>print('Aapne pucha: ${q}')</code>";
 if(q.toLowerCase().includes('snake')) ans="Snake ke liye: <br><code>import pygame<br># Full code ke liye Web Lab dekho</code>";
 if(q.toLowerCase().includes('certificate')) ans="Certificate Lab jaldi aa raha hai!";
 chat.innerHTML+=`<div style="margin:5px;background:#222;padding:8px;border-radius:10px">AI: ${ans}</div>`;
 document.getElementById('botInput').value='';
 chat.scrollTop=chat.scrollHeight;
}
</script>
